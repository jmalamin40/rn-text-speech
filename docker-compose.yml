version: '3'

services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    volumes:
      - .:/app
      - /dev/bus/usb:/dev/bus/usb
      - ~/.android:/root/.android
    privileged: true      # This is needed for USB access
    environment:
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - ANDROID_HOME=/opt/android-sdk
    network_mode: "host"  # We keep this but remove the ports mapping
    tty: true
    stdin_open: true

  backend:
    build:
      context: ./backend
      dockerfile: ../backend.Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: myapp
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: 